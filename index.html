<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TaskFlow</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --card: #22222f;
    --accent: #7c6fff;
    --accent2: #ff6f91;
    --text: #f0f0f8;
    --muted: #888899;
    --border: #2e2e3e;
    --green: #4cdf90;
    --yellow: #ffd166;
    --red: #ff6b6b;
    --radius: 16px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    padding: 52px 20px 12px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--border);
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .header h1 { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header-date { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .add-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: white; font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 15px rgba(124,111,255,0.4);
    transition: transform 0.2s;
  }
  .add-btn:active { transform: scale(0.92); }

  /* SEARCH BAR */
  .search-row {
    display: flex; gap: 8px; margin-bottom: 10px;
  }
  .search-wrap {
    flex: 1; position: relative;
  }
  .search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    font-size: 14px; color: var(--muted); pointer-events: none;
  }
  .search-input {
    width: 100%; background: var(--card); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 9px 12px 9px 32px;
    color: var(--text); font-size: 14px; outline: none;
    transition: border-color 0.2s; font-family: inherit;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }
  .sort-btn {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 0 12px; color: var(--muted);
    font-size: 12px; cursor: pointer; white-space: nowrap;
    transition: all 0.2s; font-family: inherit;
  }
  .sort-btn:active { border-color: var(--accent); color: var(--accent); }

  /* STATS BAR */
  .stats-bar {
    display: flex; gap: 10px; padding: 14px 20px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .stat {
    flex: 1; background: var(--card); border-radius: 12px;
    padding: 10px; text-align: center; cursor: pointer;
    transition: transform 0.15s;
  }
  .stat:active { transform: scale(0.96); }
  .stat-num { font-size: 20px; font-weight: 700; }
  .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-num.blue { color: var(--accent); }
  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }
  .stat-num.yellow { color: var(--yellow); }

  /* FILTER TABS */
  .filter-tabs {
    display: flex; gap: 8px; padding: 12px 20px;
    overflow-x: auto; scrollbar-width: none; background: var(--surface);
  }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
    border: 1.5px solid var(--border); background: transparent; color: var(--muted);
    cursor: pointer; white-space: nowrap; transition: all 0.2s;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: white; }

  /* TAG CHIPS */
  .tag-chips {
    display: flex; gap: 6px; padding: 8px 20px 4px;
    overflow-x: auto; scrollbar-width: none; background: var(--surface);
  }
  .tag-chips::-webkit-scrollbar { display: none; }
  .tag-chip {
    padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;
    border: 1.5px solid var(--border); background: transparent; color: var(--muted);
    cursor: pointer; white-space: nowrap; transition: all 0.2s;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .tag-chip.active { color: white; border-color: transparent; }

  /* TASK LIST */
  .task-list { padding: 16px 20px 110px; display: flex; flex-direction: column; gap: 14px; }
  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--muted);
  }
  .empty-state .icon { font-size: 52px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* TASK CARD */
  .task-card {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border); overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .task-card:active { transform: scale(0.99); }
  .task-card.done { opacity: 0.55; }

  .card-header {
    padding: 14px 14px 10px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .check-btn {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--muted); background: transparent;
    cursor: pointer; flex-shrink: 0; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; color: white; font-size: 12px;
  }
  .check-btn.checked { background: var(--green); border-color: var(--green); }

  .card-content { flex: 1; min-width: 0; }
  .task-title {
    font-size: 15px; font-weight: 600; line-height: 1.3;
    word-break: break-word;
  }
  .task-title.strikethrough { text-decoration: line-through; color: var(--muted); }

  .task-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .due-badge {
    font-size: 11px; padding: 2px 8px; border-radius: 8px; font-weight: 500;
  }
  .due-badge.ok { background: rgba(76,223,144,0.15); color: var(--green); }
  .due-badge.soon { background: rgba(255,209,102,0.15); color: var(--yellow); }
  .due-badge.overdue { background: rgba(255,107,107,0.15); color: var(--red); }
  .due-badge.done-badge { background: rgba(76,223,144,0.1); color: var(--muted); }

  .task-tag {
    font-size: 10px; padding: 2px 7px; border-radius: 6px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.4px;
  }

  .card-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 8px;
    border: none; background: var(--surface); color: var(--muted);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all 0.2s;
  }
  .icon-btn:hover { color: var(--text); background: var(--border); }
  .icon-btn.delete:hover { color: var(--red); }

  /* PROGRESS with inline controls */
  .progress-section { padding: 0 14px 10px; }
  .progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .progress-label { font-size: 11px; color: var(--muted); }
  .progress-controls { display: flex; align-items: center; gap: 6px; }
  .pct-btn {
    width: 20px; height: 20px; border-radius: 6px; border: none;
    background: var(--surface); color: var(--muted); cursor: pointer;
    font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    line-height: 1; transition: all 0.15s;
  }
  .pct-btn:active { background: var(--accent); color: white; }
  .progress-pct { font-size: 12px; font-weight: 700; color: var(--accent); min-width: 30px; text-align: center; }
  .progress-bar-bg {
    height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s ease;
  }

  /* COMMENTS SECTION */
  .comments-section {
    border-top: 1px solid var(--border); padding: 10px 14px;
    display: none;
  }
  .comments-section.open { display: block; }
  .comments-title {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .comment-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .comment-item {
    background: var(--surface); border-radius: 10px; padding: 8px 10px;
    font-size: 13px; line-height: 1.4; position: relative;
  }
  .comment-meta { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .comment-input-row { display: flex; gap: 8px; }
  .comment-input {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; color: var(--text); font-size: 13px;
    outline: none; transition: border-color 0.2s;
  }
  .comment-input:focus { border-color: var(--accent); }
  .comment-input::placeholder { color: var(--muted); }
  .send-btn {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    background: var(--accent); border: none; color: white;
    cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center;
  }

  /* MODAL OVERLAY */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 200; display: none; align-items: flex-end;
    backdrop-filter: blur(4px);
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--surface); border-radius: 24px 24px 0 0;
    padding: 24px 20px 40px; width: 100%; max-width: 430px;
    margin: 0 auto; max-height: 90vh; overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px; height: 4px; background: var(--border); border-radius: 2px;
    margin: 0 auto 20px;
  }
  .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block; }
  .form-input, .form-textarea {
    width: 100%; background: var(--card); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 12px 14px; color: var(--text); font-size: 15px;
    outline: none; transition: border-color 0.2s; font-family: inherit;
  }
  .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-input::placeholder, .form-textarea::placeholder { color: var(--muted); }
  .form-textarea { resize: none; height: 80px; }

  .tag-select-row {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .tag-sel-btn {
    padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
    border: 1.5px solid var(--border); background: transparent; color: var(--muted);
    cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.4px;
  }
  .tag-sel-btn.selected { color: white; border-color: transparent; }

  .progress-input-group { display: flex; align-items: center; gap: 12px; }
  .progress-slider {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 6px; background: var(--border); border-radius: 3px; outline: none;
  }
  .progress-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    cursor: pointer; box-shadow: 0 2px 8px rgba(124,111,255,0.4);
  }

  .submit-btn {
    width: 100%; padding: 14px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white; font-size: 16px; font-weight: 600; cursor: pointer;
    margin-top: 8px; transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(124,111,255,0.35);
  }
  .submit-btn:active { transform: scale(0.98); }

  /* STATS PAGE */
  .stats-page {
    display: none; padding: 20px 20px 110px;
  }
  .stats-page.active { display: block; }
  .tasks-view { display: block; }
  .tasks-view.hidden { display: none; }

  .stats-page h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }

  .big-stat-row { display: flex; gap: 12px; margin-bottom: 20px; }
  .big-stat {
    flex: 1; background: var(--card); border-radius: var(--radius);
    padding: 16px; text-align: center; border: 1px solid var(--border);
  }
  .big-stat-num { font-size: 32px; font-weight: 800; }
  .big-stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

  .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .donut-wrap { display: flex; justify-content: center; margin-bottom: 20px; }

  .tag-breakdown { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .tag-row { display: flex; align-items: center; gap: 10px; }
  .tag-row-label { font-size: 13px; min-width: 70px; font-weight: 500; }
  .tag-row-bar-bg { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .tag-row-bar { height: 100%; border-radius: 4px; transition: width 0.6s; }
  .tag-row-count { font-size: 12px; color: var(--muted); min-width: 20px; text-align: right; }

  .recent-done { display: flex; flex-direction: column; gap: 8px; }
  .recent-done-item {
    background: var(--card); border-radius: 12px; padding: 10px 14px;
    display: flex; align-items: center; gap: 10px; border: 1px solid var(--border);
  }
  .recent-done-item .check { font-size: 16px; }
  .recent-done-title { font-size: 14px; flex: 1; }
  .recent-done-time { font-size: 11px; color: var(--muted); }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex; padding: 10px 0 24px; z-index: 100;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 4px; cursor: pointer; padding: 4px 0;
    color: var(--muted); font-size: 10px; transition: color 0.2s;
    border: none; background: none;
  }
  .nav-item.active { color: var(--accent); }
  .nav-icon { font-size: 20px; }

  /* SORT POPUP */
  .sort-popup {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px; background: rgba(0,0,0,0.5);
    z-index: 300; display: none; justify-content: center; align-items: flex-start;
    padding-top: 160px;
  }
  .sort-popup.open { display: flex; }
  .sort-menu {
    background: var(--surface); border-radius: 16px;
    padding: 8px; width: 220px; border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .sort-option {
    padding: 12px 16px; border-radius: 10px; font-size: 14px;
    cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    transition: background 0.15s;
  }
  .sort-option:hover { background: var(--card); }
  .sort-option.active { color: var(--accent); }
  .sort-check { font-size: 12px; }

  /* PRIORITY DOT */
  .priority-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 6px;
  }
  .p-high { background: var(--red); }
  .p-medium { background: var(--yellow); }
  .p-low { background: var(--green); }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div>
      <h1>TaskFlow</h1>
      <div class="header-date" id="headerDate"></div>
    </div>
    <button class="add-btn" onclick="openModal()">+</button>
  </div>
  <div class="search-row">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" placeholder="Search tasks..." oninput="render()" />
    </div>
    <button class="sort-btn" onclick="openSort()">⇅ Sort</button>
  </div>
</div>

<!-- STATS BAR -->
<div class="stats-bar">
  <div class="stat" onclick="navTo('tasks'); setFilter('all', document.querySelectorAll('.tab')[0])">
    <div class="stat-num blue" id="statTotal">0</div>
    <div class="stat-label">Total</div>
  </div>
  <div class="stat" onclick="navTo('tasks'); setFilter('done', document.querySelectorAll('.tab')[2])">
    <div class="stat-num green" id="statDone">0</div>
    <div class="stat-label">Done</div>
  </div>
  <div class="stat" onclick="navTo('tasks'); setFilter('overdue', document.querySelectorAll('.tab')[3])">
    <div class="stat-num red" id="statOverdue">0</div>
    <div class="stat-label">Overdue</div>
  </div>
  <div class="stat">
    <div class="stat-num yellow" id="statToday">0</div>
    <div class="stat-label">Today ✓</div>
  </div>
</div>

<!-- FILTER TABS -->
<div class="filter-tabs">
  <button class="tab active" onclick="setFilter('all', this)">All</button>
  <button class="tab" onclick="setFilter('active', this)">Active</button>
  <button class="tab" onclick="setFilter('done', this)">Completed</button>
  <button class="tab" onclick="setFilter('overdue', this)">Overdue</button>
  <button class="tab" onclick="setFilter('high', this)">🔴 High</button>
</div>

<!-- TAG FILTER ROW -->
<div class="tag-chips" id="tagChips"></div>

<!-- TASKS VIEW -->
<div class="tasks-view" id="tasksView">
  <div class="task-list" id="taskList"></div>
</div>

<!-- STATS PAGE -->
<div class="stats-page" id="statsPage">
  <h2>📊 Overview</h2>
  <div class="big-stat-row">
    <div class="big-stat">
      <div class="big-stat-num" id="sp-completion" style="color:var(--accent)">0%</div>
      <div class="big-stat-label">Completion</div>
    </div>
    <div class="big-stat">
      <div class="big-stat-num" id="sp-today" style="color:var(--green)">0</div>
      <div class="big-stat-label">Done Today</div>
    </div>
    <div class="big-stat">
      <div class="big-stat-num" id="sp-avgprog" style="color:var(--yellow)">0%</div>
      <div class="big-stat-label">Avg Progress</div>
    </div>
  </div>

  <div class="section-title">By Category</div>
  <div class="tag-breakdown" id="tagBreakdown"></div>

  <div class="section-title">Priority Split</div>
  <div class="tag-breakdown" id="priorityBreakdown"></div>

  <div class="section-title" style="margin-top:20px">Recently Completed</div>
  <div class="recent-done" id="recentDone"></div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <h2 id="modalTitle">New Task</h2>

    <div class="form-group">
      <label class="form-label">Task Name *</label>
      <input class="form-input" id="inp-title" placeholder="What needs to be done?" />
    </div>

    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-textarea" id="inp-desc" placeholder="Add more details..."></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Due Date & Time</label>
      <input class="form-input" id="inp-due" type="datetime-local" />
    </div>

    <div class="form-group">
      <label class="form-label">Priority</label>
      <select class="form-input" id="inp-priority">
        <option value="low">🟢 Low</option>
        <option value="medium" selected>🟡 Medium</option>
        <option value="high">🔴 High</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Category</label>
      <div class="tag-select-row" id="tagSelectRow"></div>
    </div>

    <div class="form-group">
      <label class="form-label">Progress — <span id="progressVal">0</span>%</label>
      <div class="progress-input-group">
        <input type="range" class="progress-slider" id="inp-progress" min="0" max="100" value="0"
          oninput="document.getElementById('progressVal').textContent = this.value" />
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitTask()">Add Task</button>
  </div>
</div>

<!-- SORT POPUP -->
<div class="sort-popup" id="sortPopup" onclick="handleSortOverlay(event)">
  <div class="sort-menu">
    <div class="sort-option" onclick="setSort('created')">Newest first <span class="sort-check" id="sc-created"></span></div>
    <div class="sort-option" onclick="setSort('due')">Due date <span class="sort-check" id="sc-due"></span></div>
    <div class="sort-option" onclick="setSort('priority')">Priority <span class="sort-check" id="sc-priority"></span></div>
    <div class="sort-option" onclick="setSort('progress')">Progress <span class="sort-check" id="sc-progress"></span></div>
    <div class="sort-option" onclick="setSort('alpha')">A → Z <span class="sort-check" id="sc-alpha"></span></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-item active" id="nav-tasks" onclick="navTo('tasks')">
    <span class="nav-icon">📋</span>
    <span>Tasks</span>
  </button>
  <button class="nav-item" onclick="openModal()">
    <span class="nav-icon">➕</span>
    <span>Add</span>
  </button>
  <button class="nav-item" id="nav-stats" onclick="navTo('stats')">
    <span class="nav-icon">📊</span>
    <span>Stats</span>
  </button>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('taskflow_tasks') || '[]');
  let editingId = null;
  let activeFilter = 'all';
  let activeTag = 'all';
  let sortMode = localStorage.getItem('taskflow_sort') || 'created';
  let selectedTag = '';
  let currentNav = 'tasks';

  const TAGS = [
    { id: 'work',     label: 'Work',     color: '#7c6fff', bg: 'rgba(124,111,255,0.15)' },
    { id: 'personal', label: 'Personal', color: '#ff6f91', bg: 'rgba(255,111,145,0.15)' },
    { id: 'health',   label: 'Health',   color: '#4cdf90', bg: 'rgba(76,223,144,0.15)'  },
    { id: 'study',    label: 'Study',    color: '#ffd166', bg: 'rgba(255,209,102,0.15)' },
    { id: 'other',    label: 'Other',    color: '#888899', bg: 'rgba(136,136,153,0.15)' },
  ];

  function tagInfo(id) { return TAGS.find(t => t.id === id) || TAGS[4]; }

  function save() { localStorage.setItem('taskflow_tasks', JSON.stringify(tasks)); }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

  function formatDue(iso) {
    if (!iso) return null;
    const d = new Date(iso);
    const now = new Date();
    const diffMs = d - now;
    const diffH = diffMs / 3600000;
    const diffD = diffMs / 86400000;
    if (diffMs < 0) return { label: 'Overdue', cls: 'overdue' };
    if (diffH < 2) return { label: 'Due soon', cls: 'soon' };
    if (diffD < 1) return { label: 'Today ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}), cls: 'soon' };
    if (diffD < 2) return { label: 'Tomorrow', cls: 'ok' };
    return { label: d.toLocaleDateString([], {month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}), cls: 'ok' };
  }

  function isOverdue(task) {
    if (task.done || !task.due) return false;
    return new Date(task.due) < new Date();
  }

  function doneToday(task) {
    if (!task.done || !task.doneAt) return false;
    const d = new Date(task.doneAt);
    const n = new Date();
    return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  }

  function renderStats() {
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const overdue = tasks.filter(isOverdue).length;
    const today = tasks.filter(doneToday).length;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statDone').textContent = done;
    document.getElementById('statOverdue').textContent = overdue;
    document.getElementById('statToday').textContent = today;
  }

  function renderTagChips() {
    const usedTags = [...new Set(tasks.map(t => t.tag).filter(Boolean))];
    const chips = document.getElementById('tagChips');
    if (usedTags.length === 0) { chips.innerHTML = ''; return; }
    chips.innerHTML = ['all', ...usedTags].map(tid => {
      const info = tid === 'all' ? { label: 'All', color: 'var(--muted)', bg: 'transparent' } : tagInfo(tid);
      const isActive = activeTag === tid;
      return `<button class="tag-chip ${isActive ? 'active' : ''}"
        style="${isActive ? `background:${info.bg};color:${info.color};border-color:${info.color}` : ''}"
        onclick="setTagFilter('${tid}', this)">${info.label}</button>`;
    }).join('');
  }

  function getSorted(arr) {
    const copy = [...arr];
    const pVal = { high: 3, medium: 2, low: 1 };
    switch (sortMode) {
      case 'due': return copy.sort((a,b) => {
        if (!a.due && !b.due) return 0;
        if (!a.due) return 1;
        if (!b.due) return -1;
        return new Date(a.due) - new Date(b.due);
      });
      case 'priority': return copy.sort((a,b) => (pVal[b.priority]||0) - (pVal[a.priority]||0));
      case 'progress': return copy.sort((a,b) => (b.progress||0) - (a.progress||0));
      case 'alpha': return copy.sort((a,b) => a.title.localeCompare(b.title));
      default: return copy.sort((a,b) => new Date(b.created||0) - new Date(a.created||0));
    }
  }

  function getFiltered() {
    let result = tasks;
    const q = document.getElementById('searchInput')?.value.trim().toLowerCase();
    if (q) result = result.filter(t => t.title.toLowerCase().includes(q) || (t.desc||'').toLowerCase().includes(q));
    if (activeTag !== 'all') result = result.filter(t => t.tag === activeTag);
    switch(activeFilter) {
      case 'active':  result = result.filter(t => !t.done); break;
      case 'done':    result = result.filter(t => t.done); break;
      case 'overdue': result = result.filter(isOverdue); break;
      case 'high':    result = result.filter(t => t.priority === 'high'); break;
    }
    return getSorted(result);
  }

  function render() {
    renderStats();
    renderTagChips();
    const list = document.getElementById('taskList');
    const filtered = getFiltered();

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="icon">✅</div><p>No tasks here.<br>Tap + to add one.</p></div>`;
      return;
    }

    list.innerHTML = filtered.map(task => {
      const due = formatDue(task.due);
      const pct = task.progress || 0;
      const pDot = task.priority === 'high' ? 'p-high' : task.priority === 'medium' ? 'p-medium' : 'p-low';
      const dueBadge = task.done
        ? `<span class="due-badge done-badge">Done</span>`
        : due ? `<span class="due-badge ${due.cls}">${due.label}</span>` : '';
      const tagBadge = task.tag ? (() => {
        const ti = tagInfo(task.tag);
        return `<span class="task-tag" style="background:${ti.bg};color:${ti.color}">${ti.label}</span>`;
      })() : '';
      const comments = task.comments || [];
      const commentHTML = comments.map((c,ci) => `
        <div class="comment-item">
          ${escHtml(c.text)}
          <div class="comment-meta" style="display:flex;justify-content:space-between">
            <span>${c.date}</span>
            <span style="cursor:pointer;color:var(--red)" onclick="deleteComment('${task.id}',${ci})">✕</span>
          </div>
        </div>`).join('');

      return `
        <div class="task-card ${task.done ? 'done' : ''}" id="card-${task.id}">
          <div class="card-header">
            <div class="priority-dot ${pDot}"></div>
            <button class="check-btn ${task.done ? 'checked' : ''}" onclick="toggleDone('${task.id}')">
              ${task.done ? '✓' : ''}
            </button>
            <div class="card-content">
              <div class="task-title ${task.done ? 'strikethrough' : ''}">${escHtml(task.title)}</div>
              <div class="task-meta">
                ${dueBadge}${tagBadge}
                ${comments.length > 0 ? `<span style="font-size:11px;color:var(--muted)">💬 ${comments.length}</span>` : ''}
              </div>
              ${task.desc ? `<div style="font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4">${escHtml(task.desc)}</div>` : ''}
            </div>
            <div class="card-actions">
              <button class="icon-btn" onclick="editTask('${task.id}')" title="Edit">✏️</button>
              <button class="icon-btn" onclick="toggleComments('${task.id}')" title="Comments">💬</button>
              <button class="icon-btn delete" onclick="deleteTask('${task.id}')" title="Delete">🗑</button>
            </div>
          </div>

          <div class="progress-section">
            <div class="progress-top">
              <span class="progress-label">Progress</span>
              <div class="progress-controls">
                <button class="pct-btn" onclick="nudgeProgress('${task.id}',-10)">−</button>
                <span class="progress-pct">${pct}%</span>
                <button class="pct-btn" onclick="nudgeProgress('${task.id}',10)">+</button>
              </div>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width:${pct}%"></div>
            </div>
          </div>

          <div class="comments-section" id="comments-${task.id}">
            <div class="comments-title">Comments</div>
            <div class="comment-list" id="clist-${task.id}">${commentHTML}</div>
            <div class="comment-input-row">
              <input class="comment-input" id="cinput-${task.id}" placeholder="Add a comment..." onkeydown="if(event.key==='Enter')addComment('${task.id}')" />
              <button class="send-btn" onclick="addComment('${task.id}')">➤</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function renderStatsPage() {
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const today = tasks.filter(doneToday).length;
    const avgProg = total ? Math.round(tasks.reduce((a,t) => a + (t.progress||0), 0) / total) : 0;
    const completionPct = total ? Math.round(done / total * 100) : 0;

    document.getElementById('sp-completion').textContent = completionPct + '%';
    document.getElementById('sp-today').textContent = today;
    document.getElementById('sp-avgprog').textContent = avgProg + '%';

    // Tag breakdown
    const tagBreakdown = document.getElementById('tagBreakdown');
    const tagCounts = {};
    tasks.forEach(t => { const k = t.tag || 'other'; tagCounts[k] = (tagCounts[k]||0) + 1; });
    const maxTag = Math.max(...Object.values(tagCounts), 1);
    tagBreakdown.innerHTML = Object.entries(tagCounts).map(([tid, cnt]) => {
      const ti = tagInfo(tid);
      return `<div class="tag-row">
        <div class="tag-row-label" style="color:${ti.color}">${ti.label}</div>
        <div class="tag-row-bar-bg"><div class="tag-row-bar" style="width:${cnt/maxTag*100}%;background:${ti.color}"></div></div>
        <div class="tag-row-count">${cnt}</div>
      </div>`;
    }).join('') || '<div style="color:var(--muted);font-size:13px">No tasks yet</div>';

    // Priority breakdown
    const pBreak = document.getElementById('priorityBreakdown');
    const pCounts = { high: 0, medium: 0, low: 0 };
    tasks.forEach(t => { pCounts[t.priority || 'medium']++; });
    const maxP = Math.max(...Object.values(pCounts), 1);
    const pColors = { high: 'var(--red)', medium: 'var(--yellow)', low: 'var(--green)' };
    pBreak.innerHTML = Object.entries(pCounts).map(([p,cnt]) =>
      `<div class="tag-row">
        <div class="tag-row-label" style="color:${pColors[p]}">${p.charAt(0).toUpperCase()+p.slice(1)}</div>
        <div class="tag-row-bar-bg"><div class="tag-row-bar" style="width:${cnt/maxP*100}%;background:${pColors[p]}"></div></div>
        <div class="tag-row-count">${cnt}</div>
      </div>`).join('');

    // Recently completed
    const recent = tasks.filter(t => t.done && t.doneAt).sort((a,b) => new Date(b.doneAt)-new Date(a.doneAt)).slice(0,5);
    const recentEl = document.getElementById('recentDone');
    if (recent.length === 0) {
      recentEl.innerHTML = '<div style="color:var(--muted);font-size:13px">No completed tasks yet</div>';
    } else {
      recentEl.innerHTML = recent.map(t => `
        <div class="recent-done-item">
          <span class="check">✅</span>
          <span class="recent-done-title">${escHtml(t.title)}</span>
          <span class="recent-done-time">${new Date(t.doneAt).toLocaleDateString([],{month:'short',day:'numeric'})}</span>
        </div>`).join('');
    }
  }

  function navTo(page) {
    currentNav = page;
    document.getElementById('tasksView').classList.toggle('hidden', page !== 'tasks');
    document.getElementById('statsPage').classList.toggle('active', page === 'stats');
    document.getElementById('nav-tasks').classList.toggle('active', page === 'tasks');
    document.getElementById('nav-stats').classList.toggle('active', page === 'stats');
    if (page === 'stats') renderStatsPage();
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function toggleDone(id) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    t.done = !t.done;
    if (t.done) { t.progress = 100; t.doneAt = new Date().toISOString(); }
    else { t.doneAt = null; }
    save(); render();
  }

  function nudgeProgress(id, delta) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    t.progress = Math.min(100, Math.max(0, (t.progress || 0) + delta));
    if (t.progress === 100) { t.done = true; t.doneAt = new Date().toISOString(); }
    else { t.done = false; }
    save(); render();
  }

  function deleteTask(id) {
    if (!confirm('Delete this task?')) return;
    tasks = tasks.filter(t => t.id !== id);
    save(); render();
  }

  function deleteComment(taskId, idx) {
    const t = tasks.find(t => t.id === taskId);
    if (!t || !t.comments) return;
    t.comments.splice(idx, 1);
    save(); render();
    setTimeout(() => {
      const el = document.getElementById('comments-' + taskId);
      if (el && t.comments.length > 0) el.classList.add('open');
    }, 50);
  }

  function toggleComments(id) {
    const el = document.getElementById('comments-' + id);
    el.classList.toggle('open');
    if (el.classList.contains('open')) document.getElementById('cinput-' + id).focus();
  }

  function addComment(id) {
    const inp = document.getElementById('cinput-' + id);
    const text = inp.value.trim();
    if (!text) return;
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    if (!t.comments) t.comments = [];
    t.comments.push({
      text,
      date: new Date().toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})
    });
    inp.value = '';
    save(); render();
    setTimeout(() => {
      const el = document.getElementById('comments-' + id);
      if (el) el.classList.add('open');
    }, 50);
  }

  function setFilter(f, el) {
    activeFilter = f;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if (el) el.classList.add('active');
    render();
  }

  function setTagFilter(tid, el) {
    activeTag = tid;
    render();
  }

  function openSort() {
    document.getElementById('sortPopup').classList.add('open');
    ['created','due','priority','progress','alpha'].forEach(k => {
      document.getElementById('sc-' + k).textContent = sortMode === k ? '✓' : '';
    });
  }

  function setSort(mode) {
    sortMode = mode;
    localStorage.setItem('taskflow_sort', mode);
    document.getElementById('sortPopup').classList.remove('open');
    render();
  }

  function handleSortOverlay(e) {
    if (e.target === document.getElementById('sortPopup')) document.getElementById('sortPopup').classList.remove('open');
  }

  function renderTagSelectRow(selected) {
    const row = document.getElementById('tagSelectRow');
    row.innerHTML = TAGS.map(t => {
      const isSel = selectedTag === t.id;
      return `<button class="tag-sel-btn ${isSel ? 'selected' : ''}"
        style="${isSel ? `background:${t.bg};color:${t.color};border-color:${t.color}` : ''}"
        onclick="selectTag('${t.id}')">${t.label}</button>`;
    }).join('');
  }

  function selectTag(id) {
    selectedTag = selectedTag === id ? '' : id;
    renderTagSelectRow(selectedTag);
  }

  function openModal() {
    editingId = null;
    selectedTag = '';
    document.getElementById('modalTitle').textContent = 'New Task';
    document.getElementById('submitBtn').textContent = 'Add Task';
    document.getElementById('inp-title').value = '';
    document.getElementById('inp-desc').value = '';
    document.getElementById('inp-due').value = '';
    document.getElementById('inp-priority').value = 'medium';
    document.getElementById('inp-progress').value = 0;
    document.getElementById('progressVal').textContent = '0';
    renderTagSelectRow('');
    document.getElementById('overlay').classList.add('open');
    setTimeout(() => document.getElementById('inp-title').focus(), 300);
  }

  function editTask(id) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    editingId = id;
    selectedTag = t.tag || '';
    document.getElementById('modalTitle').textContent = 'Edit Task';
    document.getElementById('submitBtn').textContent = 'Save Changes';
    document.getElementById('inp-title').value = t.title;
    document.getElementById('inp-desc').value = t.desc || '';
    document.getElementById('inp-due').value = t.due || '';
    document.getElementById('inp-priority').value = t.priority || 'medium';
    document.getElementById('inp-progress').value = t.progress || 0;
    document.getElementById('progressVal').textContent = t.progress || 0;
    renderTagSelectRow(selectedTag);
    document.getElementById('overlay').classList.add('open');
  }

  function closeModal() { document.getElementById('overlay').classList.remove('open'); }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('overlay')) closeModal();
  }

  function submitTask() {
    const title = document.getElementById('inp-title').value.trim();
    if (!title) { document.getElementById('inp-title').focus(); return; }

    if (editingId) {
      const t = tasks.find(t => t.id === editingId);
      t.title = title;
      t.desc = document.getElementById('inp-desc').value.trim();
      t.due = document.getElementById('inp-due').value;
      t.priority = document.getElementById('inp-priority').value;
      t.progress = parseInt(document.getElementById('inp-progress').value);
      t.tag = selectedTag || null;
    } else {
      tasks.unshift({
        id: uid(),
        title,
        desc: document.getElementById('inp-desc').value.trim(),
        due: document.getElementById('inp-due').value,
        priority: document.getElementById('inp-priority').value,
        tag: selectedTag || null,
        progress: parseInt(document.getElementById('inp-progress').value),
        done: false,
        comments: [],
        created: new Date().toISOString(),
        doneAt: null
      });
    }
    save(); render(); closeModal();
  }

  document.getElementById('headerDate').textContent = new Date().toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});
  setInterval(render, 60000);
  render();
</script>
</body>
</html>
